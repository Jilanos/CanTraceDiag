server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The unprivileged Nginx image does not map `.mjs` by default.  With
    # `nosniff` enabled by the reverse proxy, serving it as
    # application/octet-stream makes browsers refuse to load the PWA entry
    # module, leaving the application unusable.
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }
}
