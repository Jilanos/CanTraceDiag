name: Release by tag

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/jilanos/cantracediag

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Validate PWA engine
        run: |
          node --experimental-strip-types --test spikes/pwa-local-engine/tests/*.test.ts
          node spikes/pwa-local-engine/build-browser.mjs
          test -f spikes/pwa-local-engine/site/index.html
          test -f spikes/pwa-local-engine/site/sw.js
      - name: Install Playwright Chromium for the generated-site smoke
        run: npx --yes playwright@1.49.1 install --with-deps chromium
      - name: Generated site browser smoke test
        # The release gate must exercise the delivered artifact itself, not
        # rely on the assumption that push CI already covered this SHA.
        run: node spikes/pwa-local-engine/browser-smoke.mjs
        env:
          CTD_ENGINE_ROOT: spikes/pwa-local-engine/site
          CTD_ENGINE_PORT: "9880"
          CTD_ENGINE_DEBUG_PORT: "9230"

  validate-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[api,dev]"
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
        env:
          CI: "true"

  publish:
    needs: [validate, validate-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy exact image and verify health
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /home/deploy/paulmondou-infra
            ./scripts/deploy-image.sh cantracediag '${{ env.IMAGE }}:${{ github.ref_name }}' 'https://cantracediag.paulmondou.fr/' CANTRACEDIAG_IMAGE

  windows:
    # Built and smoke-tested from the tag itself; the provenance records it.
    uses: ./.github/workflows/windows.yml
    with:
      tag: ${{ github.ref_name }}

  publish-windows:
    # Depends on validation and the Windows build only -- never on the web
    # deploy -- so the repository launcher can resolve the release even when
    # the hosted PWA deployment fails (req_034 AC9).
    needs: [validate, validate-python, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cantracediag-windows-x64
          path: windows
      - name: Verify the tested artifact before publishing
        shell: bash
        run: |
          set -euo pipefail
          cd windows/windows
          sha256sum --check --strict ./*.exe.sha256
          python3 - <<'PY'
          import glob, json, os
          prov = json.load(open(glob.glob("*.provenance.json")[0], encoding="utf-8-sig"))
          assert prov["tag"] == os.environ["GITHUB_REF_NAME"], prov["tag"]
          assert prov["commit"] == os.environ["GITHUB_SHA"], prov["commit"]
          assert prov["version"] == os.environ["GITHUB_REF_NAME"][1:], prov["version"]
          PY
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            windows/windows/*.exe
            windows/windows/*.exe.sha256
            windows/windows/*.provenance.json
            windows/windows/THIRD_PARTY_NOTICES.txt

  release:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
