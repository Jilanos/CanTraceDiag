name: CI

on:
  push:
  pull_request:

jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Validate PWA engine
        run: |
          node --experimental-strip-types --test spikes/pwa-local-engine/tests/*.test.ts
          node spikes/pwa-local-engine/build-browser.mjs
          test -f spikes/pwa-local-engine/site/index.html
          test -f spikes/pwa-local-engine/site/sw.js
      - name: Static delivery smoke test
        run: |
          python3 -m http.server 8770 --bind 127.0.0.1 --directory spikes/pwa-local-engine/site >/tmp/cantracediag-pwa-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python3 - <<'PY'
          import time
          import urllib.request

          # The background HTTP server is not guaranteed to be ready on the
          # next scheduler tick. Wait briefly so this verifies delivery rather
          # than racing process startup.
          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8770/", timeout=1) as response:
                      assert response.status == 200, response.status
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise RuntimeError("Static PWA server did not start within 3 seconds")

          for path in ("/", "/index.html", "/manifest.webmanifest", "/sw.js"):
              with urllib.request.urlopen("http://127.0.0.1:8770" + path) as response:
                  assert response.status == 200, (path, response.status)
          PY
      - name: Container MIME smoke test
        run: |
          docker build -t cantracediag-pwa-smoke .
          docker run --detach --rm --name cantracediag-pwa-smoke -p 18080:8080 cantracediag-pwa-smoke
          trap 'docker stop cantracediag-pwa-smoke' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/ >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl --fail --silent --head http://127.0.0.1:18080/browser/product-app.mjs | tr -d '\r' | awk -F': ' 'tolower($1) == "content-type" { print tolower($2) }')" = "application/javascript"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[api,dev]"
      - name: Install Playwright Chromium
        # E2E viewport/accessibility tests must run in CI; with CI=true the
        # suite fails (not skips) if the browser cannot launch (AC14).
        run: python -m playwright install --with-deps chromium
      - name: Packaging smoke test
        run: |
          python -c "import cantracediag; print(cantracediag.__version__)"
          cantracediag --help
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
        env:
          CI: "true"
